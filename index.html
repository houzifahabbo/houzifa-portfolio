<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Houzifahabbo – 3D Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;background:#111;color:#eee;font-family:system-ui, sans-serif;}
  canvas{display:block;width:100vw;height:100vh;}
  .info{position:absolute;top:10px;left:20px;z-index:10;}
</style>
</head>
<body>
<div class="info">Houzifahabbo – 3D Demo</div>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);

  const geometry = new THREE.BoxGeometry();
  const material = new THREE.MeshNormalMaterial();
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);

  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshBasicMaterial({color:0x111111})
  );
  bg.position.z = -1;
  scene.add(bg);

  function animate(){
    requestAnimationFrame(animate);
    cube.rotation.x += 0.005;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () =>{const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();});
</script>
</body>
</html>
